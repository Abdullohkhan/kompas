# Optional local PostgreSQL for development. Usage:
#   POSTGRES_PASSWORD=choose-one docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulseboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
